


version: "3.9"
services:
  superlink:
    image: flwr/superlink:${FLWR_VERSION:-1.23.0}
    command:
      - --isolation
      - process
      - --insecure
      - --database=state/state.db
    volumes:
      - ./state/:/app/state/:rw
    ports:
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"


  superexec-serverapp:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile_inline: |
        FROM flwr/superexec:${FLWR_VERSION:-1.23.0}
        RUN pip install --no-cache-dir prometheus-client
        RUN pip install --no-cache-dir psutil
        WORKDIR /app
        COPY --chown=app:app pyproject.toml .
        RUN sed -i 's/.*flwr\[simulation\].*//' pyproject.toml \
          && python -m pip install -U --no-cache-dir .
        ENTRYPOINT ["flower-superexec"]
    ports:
      - "8001:8001"
    command:
      - --insecure
      - --plugin-type
      - serverapp
      - --appio-api-address
      - superlink:9091
    depends_on:
      - superlink
      
    volumes:
      - ../Data:/app/Data
      - ../Done:/app/Done
      - ../Model:/app/model
