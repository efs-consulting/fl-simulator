# Grafana Data Sources for FL Simulator
# Created: 2025-11-29

apiVersion: 1

datasources:
  # InfluxDB - Primary data source for FL metrics
  - name: InfluxDB-FL
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    uid: influxdb-fl
    isDefault: true
    jsonData:
      version: Flux
      organization: flower
      defaultBucket: fl-metrics
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN:-fl-simulator-token-2025}

  # Prometheus - Real-time metrics and alerting
  - name: Prometheus-FL
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus-fl
    isDefault: false
    jsonData:
      timeInterval: "1s"
      queryTimeout: "60s"
      httpMethod: "POST"

  # InfluxDB Hourly Bucket (for downsampled data)
  - name: InfluxDB-FL-Hourly
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    uid: influxdb-fl-hourly
    jsonData:
      version: Flux
      organization: flower
      defaultBucket: fl-metrics-hourly
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN:-fl-simulator-token-2025}
