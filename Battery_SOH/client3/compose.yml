version: "3.9"

services:
  supernode-4:
    image: flwr/supernode:${FLWR_VERSION:-1.23.0}
    environment:
      # Disable Ray metrics exporter to prevent connection errors
      - RAY_DISABLE_METRICS=1
      - RAY_metrics_exporter_port=0
      - RAY_BACKEND_LOG_LEVEL=warning
      - RAY_enable_metrics_export=false
      - PYTHONUNBUFFERED=1
    command:
      - --insecure
      - --superlink
      - ${SERVER_IP:-host.docker.internal}:9092
      - --clientappio-api-address
      - 0.0.0.0:9097
      - --isolation
      - process
      - --node-config
      - "partition-id=3 num-partitions=6"
    ports:
      - "9097:9097"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - fl-monitoring-network

  superexec-clientapp-4:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile_inline: |
        FROM flwr/superexec:${FLWR_VERSION:-1.23.0}
        RUN pip install --no-cache-dir prometheus-client
        RUN pip install --no-cache-dir psutil
        RUN pip install --no-cache-dir influxdb-client
        WORKDIR /app1
        COPY --chown=app:app pyproject.toml .
        COPY --chown=app:app sklearnexample/ ./sklearnexample/
        RUN sed -i 's/.*flwr\[simulation\].*//' pyproject.toml \
          && python -m pip install -U --no-cache-dir .
        ENV RAY_DISABLE_METRICS=1
        ENV RAY_metrics_exporter_port=0
        ENV RAY_BACKEND_LOG_LEVEL=warning
        ENTRYPOINT ["flower-superexec"]
    ports:
      - "8004:8004"
    environment:
      # Disable Ray metrics exporter to prevent connection errors
      - RAY_DISABLE_METRICS=1
      - RAY_metrics_exporter_port=0
      - RAY_BACKEND_LOG_LEVEL=warning
      - RAY_enable_metrics_export=false
      - PYTHONUNBUFFERED=1
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-4:9097
    depends_on:
      - supernode-4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./quickstart-sklearn-tabular/Data:/app1/Data
      - ./quickstart-sklearn-tabular/Done:/app1/Done
    networks:
      - default
      - fl-monitoring-network

networks:
  fl-monitoring-network:
    external: true
