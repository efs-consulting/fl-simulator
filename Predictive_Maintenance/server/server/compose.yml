


version: "3.9"
services:
  superlink:
    image: flwr/superlink:${FLWR_VERSION:-1.23.0}
    environment:
      # Disable Ray metrics exporter to prevent connection errors
      - RAY_DISABLE_METRICS=1
      - RAY_metrics_exporter_port=0
      - RAY_BACKEND_LOG_LEVEL=warning
      - RAY_enable_metrics_export=false
      - PYTHONUNBUFFERED=1
    command:
      - --isolation
      - process
      - --insecure
      - --database=/tmp/state.db
    tmpfs:
      - /tmp
    ports:
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    networks:
      - default
      - fl-monitoring-network

  superexec-serverapp:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile_inline: |
        FROM flwr/superexec:${FLWR_VERSION:-1.23.0}
        RUN pip install --no-cache-dir prometheus-client
        RUN pip install --no-cache-dir psutil
        RUN pip install --no-cache-dir influxdb-client
        WORKDIR /app
        COPY --chown=app:app pyproject.toml .
        COPY --chown=app:app sklearnexample/ ./sklearnexample/
        RUN sed -i 's/.*flwr\[simulation\].*//' pyproject.toml \
          && python -m pip install -U --no-cache-dir .
        ENV RAY_DISABLE_METRICS=1
        ENV RAY_metrics_exporter_port=0
        ENV RAY_BACKEND_LOG_LEVEL=warning
        ENTRYPOINT ["flower-superexec"]
    ports:
      - "8001:8001"
    environment:
      # Disable Ray metrics exporter to prevent connection errors
      - RAY_DISABLE_METRICS=1
      - RAY_metrics_exporter_port=0
      - RAY_BACKEND_LOG_LEVEL=warning
      - RAY_enable_metrics_export=false
      - PYTHONUNBUFFERED=1
      # InfluxDB connection via Docker network
      - INFLUXDB_URL=http://fl-influxdb:8086
      - INFLUXDB_TOKEN=fl-simulator-token-2025
      - INFLUXDB_ORG=flower
      - INFLUXDB_BUCKET=fl-metrics
    command:
      - --insecure
      - --plugin-type
      - serverapp
      - --appio-api-address
      - superlink:9091
    depends_on:
      - superlink
    volumes:
      - ../Data:/app/Data
      - ../Done:/app/Done
      - ../Model:/app/model
    networks:
      - default
      - fl-monitoring-network

networks:
  fl-monitoring-network:
    external: true

volumes:
  superlink-state:
